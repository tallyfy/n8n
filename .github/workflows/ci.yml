# Runs lint, typecheck, the jest suite and the build on every pull request and on every push to
# main.
#
# Why this exists. Until 2026-08-28, release.yml was the only workflow in this repo and it fires
# on `push: tags: v*` alone, so a pull request produced zero checks and a push to main produced
# zero checks. version-sync.yml (#39) then added exactly one narrow check. Everything else, lint,
# the build and the whole jest suite, still fired for the first time DURING the publish itself,
# and a `v*` tag push here is an irreversible public npm publish. So the first time anyone learned
# a change was red was while shipping it to the registry. This workflow moves those four gates in
# front of the merge instead (tallyfy/work-queue#1174).
#
# A gate over an empty set is indistinguishable from a passing gate, so for most of this
# repository's life "checks green" on a pull request meant nothing at all: there were none. Every
# job below therefore asserts its inputs are non-empty before it asserts anything else.
#
# Why four separate jobs rather than four steps in one job. Each job is its own check context, so
# a failure names the gate that failed without anyone opening a log, and any of them can later be
# made a required context on main independently. The cost is four `npm ci` runs, which is free on
# a public repository and runs in parallel.
#
# Deliberate parity with release.yml: same Node version, same `npm ci`, same `npm run lint`, same
# `npm test`, same `npm run build`. If these four are green then the four equivalent steps inside
# the publish are green for the same commit. Divergence between the two would defeat the point.
#
# Why most of the assertions are inline here, when scripts/check-changelog.sh,
# scripts/check-version-sync.sh and scripts/check-icons.sh deliberately are not. Those three are
# also run from release.yml, and a step there is only reachable by pushing a `v*` tag, which
# publishes to npm immediately and irreversibly, so it could never be exercised before being
# relied on and had to be testable offline. Every other step in this file is reachable by opening
# an ordinary pull request, so it can be, and was, driven red and green before merge.
#
# The icon assertion moved out of this file into scripts/check-icons.sh on 2026-08-29
# (tallyfy/n8n#43) for exactly that reason: the release path needed the same check, and keeping a
# second inline copy there would have left the untestable copy to rot.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# github.event_name is in the group key on purpose, so a pull_request run and a push run for the
# same branch cannot share a group and cancel one another. cancel-in-progress is true only for
# pull requests: on a push, head_ref is empty, so every merge would otherwise fall through to the
# same ref_name key and each merge would cancel the previous merge's verdict. Same shape as
# version-sync.yml, for the same reason.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `registry-url` here, on purpose. Setting it makes setup-node write
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into a temp .npmrc; with no token that
      # expands to empty, npm treats auth as configured and skips the OIDC exchange. Only
      # release.yml publishes, but keeping the two files identical on this point stops the habit
      # from being copied into the one that does.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert dependencies are actually present
        run: |
          set -euo pipefail
          COUNT=$(ls -1 node_modules | wc -l | tr -d ' ')
          echo "node_modules entries: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "node_modules holds $COUNT entries, so the check below would run against nothing" >&2
            exit 1
          fi

      # Same command release.yml runs. eslint exits non-zero on errors only, so the nine
      # pre-existing @typescript-eslint/no-explicit-any WARNINGS in Tallyfy.node.ts do not fail
      # this job, exactly as they do not fail the publish. Tightening that is a separate decision
      # and deliberately not made here.
      - name: Lint
        run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert dependencies are actually present
        run: |
          set -euo pipefail
          COUNT=$(ls -1 node_modules | wc -l | tr -d ' ')
          echo "node_modules entries: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "node_modules holds $COUNT entries, so the checks below would run against nothing" >&2
            exit 1
          fi
          test -x ./node_modules/.bin/tsc

      # `tsc` raises TS18003 "No inputs were found" only when EVERY include pattern in a config
      # matches nothing. One dead pattern among several is completely silent and the compile exits
      # 0, so the two tsc steps below would both be green on a config that has stopped describing
      # where the sources are (tallyfy/n8n#45). Measured 2026-08-30, three arms on one invocation:
      # two real includes plus one bogus one gave rc 0 and no output, a single bogus include gave
      # rc 2 and TS18003, a single real include gave rc 0. The live instance was
      # `nodes/**/*.json` in tsconfig.json matching 0 files, removed in the same change.
      #
      # It runs FIRST in this job, before either tsc, for the same reason the CHANGELOG check runs
      # first in release.yml: it names the broken pattern directly, where the tsc steps would
      # either say nothing or fail somewhere downstream of the real cause.
      #
      # The logic is in a script rather than inline because release.yml needs the same assertion
      # on the one path that is irreversible, and a step there can only be exercised by pushing a
      # v* tag, which publishes to npm. Two copies in two workflows would drift and the untestable
      # one would rot. Exercised offline by test/scripts/check-tsconfig-includes.test.ts, so
      # `npm test` covers it too.
      #
      # This is deliberately redundant with package.json's "build", which now also runs it first.
      # The redundancy is the point: this step still fires if the build script is ever edited to
      # drop the check, which is the single edit that would silently reopen the hole. Same argument
      # release.yml already makes for check-icons.sh.
      - name: Assert every tsconfig include pattern matches at least one file
        run: scripts/check-tsconfig-includes.sh

      # Two projects, because they cover different files and neither alone is the whole tree.
      # tsconfig.json is what the publish compiles: credentials/ and nodes/ only, since it
      # excludes test. tsconfig.jest.json adds the test tree on top of that.
      #
      # The local binary is invoked by path rather than through npx. `npx tsc` in a tree with no
      # node_modules does not fail with "command not found": it downloads an unrelated deprecated
      # package literally named `tsc` and exits non-zero with a message about not being the tsc
      # you are looking for, which reads as a broken branch rather than a broken setup.
      - name: Typecheck the published sources
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Typecheck the sources plus the test tree
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.jest.json

      # Non-vacuity guard for the step above, and it is not hypothetical. tsconfig.jest.json's
      # `include` of test/**/*.ts was dead until this change: the base tsconfig's `exclude` of
      # "test" and "**/*.test.ts" is inherited and cancels it, so tsc silently checked 3 files,
      # reported success, and never looked at a single test file. That is the exact shape this
      # workflow exists to stop, so the count is asserted rather than trusted.
      - name: Assert the test tree really is in that second project
        run: |
          set -euo pipefail
          LISTED=$(mktemp)
          ./node_modules/.bin/tsc -p tsconfig.jest.json --listFilesOnly > "$LISTED"
          COVERED=$(grep -c "/test/" "$LISTED" || echo 0)
          DECLARED=$(find test -name '*.ts' -type f | wc -l | tr -d ' ')
          echo "test/*.ts on disk: $DECLARED   type-checked by tsconfig.jest.json: $COVERED"
          if [ "$DECLARED" -eq 0 ]; then
            echo "found no .ts under test/, so the comparison below would be vacuous" >&2
            exit 1
          fi
          if [ "$COVERED" -ne "$DECLARED" ]; then
            echo "tsconfig.jest.json type-checks $COVERED of $DECLARED test files" >&2
            echo "an inherited 'exclude' is most likely cancelling its 'include' again" >&2
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert dependencies are actually present
        run: |
          set -euo pipefail
          COUNT=$(ls -1 node_modules | wc -l | tr -d ' ')
          echo "node_modules entries: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "node_modules holds $COUNT entries, so the suite below would run against nothing" >&2
            exit 1
          fi

      # TALLYFY_LIVE is deliberately unset, so test/live/Tallyfy.live.test.ts stays skipped and no
      # staging credentials or network access are needed. Same as release.yml.
      - name: Test
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert dependencies are actually present
        run: |
          set -euo pipefail
          COUNT=$(ls -1 node_modules | wc -l | tr -d ' ')
          echo "node_modules entries: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "node_modules holds $COUNT entries, so the build below would run against nothing" >&2
            exit 1
          fi

      # `npm run build` is `tsc && gulp build:icons && scripts/check-icons.sh`. The gulp half had
      # never been exercised by anything before this workflow, and the icon assertion is now part
      # of the build script itself, so this step fails on a broken icon copy on its own.
      - name: Build
        run: npm run build

      # `gulp build:icons` copies nodes/**/*.svg into dist/nodes. That glob contains magic
      # characters, so gulp does NOT error when it matches nothing: it copies zero files and exits
      # 0. A bare `npm run build` therefore could not distinguish a working icon copy from one that
      # silently produced an empty set, and a published package whose node has no icon is a real
      # user-facing defect (tallyfy/n8n#43).
      #
      # This was an inline block until 2026-08-29. It is a script now because release.yml needs the
      # same assertion on the one path that is irreversible, and a step there can only be exercised
      # by pushing a v* tag, which publishes. Two copies of the same logic in two workflows would
      # drift, and the copy in the file nobody can test is the one that would rot. The script is
      # exercised offline by test/scripts/check-icons.test.ts, so `npm test` covers it too.
      #
      # Kept as its own step even though `npm run build` above already runs it. It costs a second,
      # it names the gate in the log without anyone opening the Build step, and it still fires if
      # the build script is ever edited to drop the check.
      - name: Assert the icon copy reproduced the source set
        run: scripts/check-icons.sh

      # package.json carries `"files": ["dist"]` and dist is a gitignored build output, so
      # `npm pack` on a tree that was never built does not complain. It builds a tarball out of
      # the metadata npm always includes and exits 0. Measured 2026-08-30 on a clean checkout,
      # both arms of the same probe: with no dist, rc 0 and 4 entries, LICENSE, README.md,
      # index.js and package.json; with dist present, rc 0 and 14 entries. So npm would publish a
      # package containing none of the code and report success (tallyfy/n8n#45).
      #
      # This asserts the tarball CONTENTS, not npm pack's exit code, because the exit code is the
      # thing that is wrong. What it requires is every path under package.json's `n8n.nodes` and
      # `n8n.credentials`, named rather than counted. "the tarball holds a .js" would not do:
      # index.js is at the package root and npm always includes the file named by `main`, so that
      # assertion passes on the 4-entry tarball above.
      #
      # It runs after Build on purpose, since it is asserting what the build produced. The logic is
      # in a script for the same reason check-icons.sh is: release.yml needs it on the irreversible
      # path and a step there can only be exercised by publishing. Exercised offline by
      # test/scripts/check-pack-contents.test.ts.
      - name: Assert the tarball would contain the declared entry points
        run: scripts/check-pack-contents.sh
