# Publishes n8n-nodes-tallyfy to npm with provenance (required for n8n verified
# community nodes since 2026-05-01). Triggered by pushing a version tag (v*).
#
# Setup required once, on npmjs.com, NOT in GitHub secrets: register a trusted
# publisher for n8n-nodes-tallyfy under Settings -> Trusted publishers -> GitHub
# Actions, with organization `tallyfy`, repository `n8n`, workflow filename
# `release.yml`. Authentication is then OIDC: this workflow exchanges the
# id-token below for a short-lived npm credential, and no long-lived token is
# stored anywhere.
#
# This replaced an NPM_TOKEN repository secret. That secret was DELETED on
# 2026-08-08 and this repo now has zero secrets (`gh api
# repos/tallyfy/n8n/actions/secrets` -> total_count: 0). Nothing here reads it.
# (This comment said the secret "may still exist ... and can be deleted" until
# 2026-08-11, a day after it was already gone.) The old arrangement could not
# publish anyway: a token publish is refused unless
# the token is a granular access token with 2FA bypass, and npm removes direct
# publishing from those around Jan 2027, so a replacement token would have been
# obsolete within months.
#
# Provenance needs no secret either - it uses the same OIDC token
# (id-token: write) and requires this repository to be public, which it is.
#
# Release flow. This is the same procedure, in the same order, as the "n8n"
# section of tallyfy/middleware docs/PUBLISHING-RUNBOOK.md. Keep the two in
# step: they drifted apart once, this header omitted the CHANGELOG entry, and
# three releases (1.1.0, 1.1.1, 1.1.2) then shipped without one, because the
# step that only one document mentioned is the step that stopped happening
# (tallyfy/n8n#18).
#
#   1. Land the change on main.
#   2. Build and lint, both green.
#   3. Bump "version" in package.json AND add a CHANGELOG.md entry for it,
#      as "## [X.Y.Z] - YYYY-MM-DD". Step 5 below now fails without it.
#   4. Commit that to main.
#   5. git tag vX.Y.Z && git push origin vX.Y.Z
#      This workflow then verifies CHANGELOG.md has a heading for the tag,
#      lints, builds, tests, verifies the tag matches package.json, and
#      publishes with --provenance.
#   6. Live check: update the community package on the answers-n8n droplet.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stops a release with no CHANGELOG entry, which is what happened to 1.1.0, 1.1.1 and
      # 1.1.2 (tallyfy/n8n#18).
      #
      # It runs first, before npm ci, on purpose. It needs nothing but the checkout, so failing
      # here costs seconds rather than the several minutes of install, lint, build and test that
      # would otherwise run before anyone learns the release is malformed. Placing it after the
      # Test step would also make it unreachable as a failure: the suite already asserts that the
      # version in package.json has a heading, and the next step asserts the tag equals that
      # version, so the two together imply this one. Running it up front keeps it an independent
      # check that still fires if the suite is ever changed.
      #
      # The logic lives in a script rather than inline because a workflow step can only be
      # exercised by pushing a v* tag, and a tag push here publishes to npm immediately and
      # irreversibly, so an inline gate could never be tested before it was relied on. The script
      # is exercised offline by test/scripts/check-changelog.test.ts.
      - name: Verify CHANGELOG has an entry for this tag
        run: scripts/check-changelog.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing (OIDC) needs npm >= 11.5.1 and Node 22 ships an older npm, so the
      # runner's bundled version is not enough. Without this the publish step falls back to
      # looking for a token and fails with E401/E403 rather than anything that names OIDC.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Runs the mocked unit suite only: the live integration suite is gated behind
      # TALLYFY_LIVE=1 (unset here), so no staging credentials or network are needed.
      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # Authentication is npm trusted publishing (OIDC): the runner exchanges the id-token
      # granted above for a short-lived npm credential. There is deliberately NO NODE_AUTH_TOKEN
      # here — the long-lived NPM_TOKEN secret this step used to read is not needed, and npm
      # removes direct publishing from bypass-2FA tokens around Jan 2027, so a token would have
      # been a short-lived fix. Provenance is generated because tallyfy/n8n is a PUBLIC repo;
      # npm does not generate it for packages published from private repositories.
      #
      # The trusted publisher IS registered and this path WORKS: 1.1.2 was published
      # through it on 2026-08-08 and carries 2 attestations (npm publish + SLSA v1).
      # Registration is org `tallyfy`, repo `n8n`, workflow `release.yml`, under
      # npmjs.com Settings -> Trusted publishers -> GitHub Actions.
      #
      # ⚠️ This comment read "This step CANNOT work until the trusted publisher is
      # registered" until 2026-08-11, three days after it started working. It sat in
      # the last file a releaser reads before an irreversible tag push, where it looks
      # like an unmet setup gate - which is the direction that stops a valid release.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
